<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twibbon Success Ladder Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 flex flex-col items-center justify-center font-sans">

  <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl max-w-xl w-full space-y-5">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800">Generator Twibbon Success Ladder</h1>
      <p class="text-sm text-slate-500">Unggah template, foto diri, dan isi data Anda</p>
    </div>

    <!-- Form Input -->
    <div class="space-y-4">
      <!-- Input Frame/Template PNG -->
      <div class="p-3 bg-red-50 rounded-xl border border-red-200">
        <label class="block text-sm font-semibold text-red-800 mb-1">1. Unggah File Template (PNG Transparan)</label>
        <input type="file" id="frameInput" accept="image/png,image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-red-700 file:text-white hover:file:bg-red-800 cursor-pointer">
      </div>

      <!-- Input Foto Diri -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">2. Unggah Foto Diri</label>
        <input type="file" id="photoInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
        <input type="text" id="nameInput" placeholder="Contoh: BUDI SANTOSO" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none border-slate-300">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Program Studi</label>
        <input type="text" id="prodiInput" placeholder="Contoh: S1 MANAJEMEN" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none border-slate-300">
      </div>
    </div>

    <!-- Canvas Preview (1024 x 723) -->
    <div class="relative w-full aspect-[1024/723] border rounded-2xl overflow-hidden bg-slate-50 shadow-inner">
      <canvas id="twibbonCanvas" width="1024" height="723" class="w-full h-full object-contain"></canvas>
    </div>

    <!-- Tombol Download -->
    <button id="downloadBtn" class="w-full bg-red-700 hover:bg-red-800 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 text-center">
      Download Twibbon Saya
    </button>
  </div>

  <script>
    const canvas = document.getElementById('twibbonCanvas');
    const ctx = canvas.getContext('2d');

    const frameInput = document.getElementById('frameInput');
    const photoInput = document.getElementById('photoInput');
    const nameInput = document.getElementById('nameInput');
    const prodiInput = document.getElementById('prodiInput');
    const downloadBtn = document.getElementById('downloadBtn');

    let userPhoto = null;
    let frameImg = null;

    // Load Frame dari Input File
    frameInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          frameImg = new Image();
          frameImg.onload = drawCanvas;
          frameImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Load Foto Diri dari Input File
    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          userPhoto = new Image();
          userPhoto.onload = drawCanvas;
          userPhoto.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    nameInput.addEventListener('input', drawCanvas);
    prodiInput.addEventListener('input', drawCanvas);

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. LAYER FOTO PENGGUNA
      if (userPhoto) {
        ctx.save();
        
        const circleX = 371;
        const circleY = 399;
        const radius = 175;

        ctx.beginPath();
        ctx.arc(circleX, circleY, radius, 0, Math.PI * 2, true);
        ctx.closePath();
        ctx.clip();

        const size = radius * 2;
        const hRatio = size / userPhoto.width;
        const vRatio = size / userPhoto.height;
        const ratio = Math.max(hRatio, vRatio);

        const renderW = userPhoto.width * ratio;
        const renderH = userPhoto.height * ratio;
        const renderX = circleX - renderW / 2;
        const renderY = circleY - renderH / 2;

        ctx.drawImage(userPhoto, renderX, renderY, renderW, renderH);
        ctx.restore();
      } else {
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 2. LAYER GAMBAR TEMPLATE
      if (frameImg) {
        ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
      }

      // 3. LAYER TEKS
      ctx.textAlign = 'center';

      // Nama Lengkap
      const nameText = nameInput.value.trim().toUpperCase() || "NAMA LENGKAP";
      ctx.font = 'bold 52px sans-serif';
      ctx.fillStyle = '#800000';
      ctx.fillText(nameText, 745, 340);

      // Program Studi
      const prodiText = prodiInput.value.trim().toUpperCase() || "PROGRAM STUDI";
      ctx.font = '500 32px sans-serif';
      ctx.fillStyle = '#1e293b';
      ctx.fillText(prodiText, 745, 400);
    }

    drawCanvas();

    downloadBtn.addEventListener('click', () => {
      if (!frameImg) {
        alert("Silakan unggah file template terlebih dahulu!");
        return;
      }
      const link = document.createElement('a');
      link.download = `Twibbon_${nameInput.value.trim() || 'Success_Ladder'}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
